---
# tasks file for roles/deploy
- name: setup nodesource
  ansible.builtin.shell:
    cmd: curl -fsSL https://deb.nodesource.com/setup_23.x | sudo bash
- name: install node/npm
  ansible.builtin.apt:
    name: nodejs
- name: clone source repo
  ansible.builtin.git:
    repo: https://gitlab.com/Reece-Elder/devops-m5-nodeproject
    version: main
    dest: /home/ubuntu/app
- name: install deps
  ansible.builtin.shell:
    cmd: npm i
    chdir: /home/ubuntu/app
- name: install forever
  ansible.builtin.shell:
    cmd: npm install forever -g
    chdir: /home/ubuntu/app
- name: run app
  ansible.builtin.shell:
    cmd: forever start index.js
    chdir: /home/ubuntu/app
